name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack and verify pinned pnpm
        run: |
          corepack enable
          corepack pnpm --version

      - name: Install dependencies from frozen lockfile
        run: corepack pnpm install --frozen-lockfile

      - name: Check changed files for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BASE_SHA}..${GITHUB_SHA}"
          else
            git show --check --format= "${GITHUB_SHA}"
          fi

      - name: Run typecheck, coverage tests, and build
        run: corepack pnpm run check

      - name: Verify built CLI and persisted SQLite state
        run: corepack pnpm run ci:smoke
